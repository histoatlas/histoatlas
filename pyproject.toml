[project]
name = "histoatlas"
version = "0.1.0"
description = "Interactive morphology atlas linking histomics to molecular and clinical variables"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Pierre-Antoine Bannier" }]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "fastparquet>=2023.4.0",
    "pyarrow>=12.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "openpyxl>=3.1.0",
    "ipykernel>=7.1.0",
    "scikit-learn>=1.7.2",
    "umap-learn>=0.5.7",
    "numba>=0.59.0",
    "scipy>=1.10.0",
    "nbconvert>=7.17.0",
    "hdbscan>=0.8.41",
    "lifelines>=0.27.0",
    "statsmodels>=0.14.0",
    "joblib>=1.3.0",
    "orjson>=3.11.7",
    "gseapy>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.2",
    "mypy>=1.4.0",
    "pandas-stubs",
    "types-docutils",
    "types-python-dateutil",
    "types-setuptools",
    "typing_extensions",
    "ipdb>=0.13.13",
    "httpx>=0.27.0",
    "pre-commit>=3.5.0",
    "nbstripout>=0.7.0",
]
workflow = [
    "snakemake>=9.0; python_version >= '3.11'",  # Snakemake 9.x requires Python >=3.11
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "prometheus-client>=0.21.0",
]
mcp = [
    "fastmcp>=2.0.0",
]
remote = [
    "typer>=0.9.0",
    "jinja2>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["histoatlas"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N806", "E741", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["histoatlas"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = false
disallow_untyped_defs = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=histoatlas"

