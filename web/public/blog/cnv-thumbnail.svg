<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#FAFBFC"/>

  <!-- Chromosome ideogram-style pattern -->
  <!-- Amplification regions (blue) and deletion regions (red) -->

  <!-- Chromosome bars -->
  <rect x="40" y="50" width="24" height="300" rx="12" fill="#E4E4E7"/>
  <rect x="40" y="80" width="24" height="60" rx="6" fill="#3B82F6"/>
  <rect x="40" y="200" width="24" height="40" rx="6" fill="#EF4444"/>

  <rect x="90" y="50" width="24" height="280" rx="12" fill="#E4E4E7"/>
