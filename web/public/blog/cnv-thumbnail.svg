  <rect x="490" y="130" width="24" height="30" rx="6" fill="#3B82F6"/>

  <!-- Gene labels -->
  <text x="52" y="388" font-family="Inter, sans-serif" font-size="11" fill="#71717A" text-anchor="middle">1</text>
  <text x="102" y="388" font-family="Inter, sans-serif" font-size="11" fill="#71717A" text-anchor="middle">2</text>
  <text x="152" y="388" font-family="Inter, sans-serif" font-size="11" fill="#71717A" text-anchor="middle">3</text>
  <text x="202" y="388" font-family="Inter, sans-serif" font-size="11" fill="#71717A" text-anchor="middle">4</text>
