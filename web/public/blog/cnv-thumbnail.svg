  <rect x="240" y="50" width="24" height="220" rx="12" fill="#E4E4E7"/>
  <rect x="240" y="70" width="24" height="60" rx="6" fill="#EF4444"/>
  <rect x="240" y="190" width="24" height="50" rx="6" fill="#3B82F6"/>

  <rect x="290" y="50" width="24" height="200" rx="12" fill="#E4E4E7"/>
  <rect x="290" y="130" width="24" height="70" rx="6" fill="#3B82F6"/>

  <rect x="340" y="50" width="24" height="190" rx="12" fill="#E4E4E7"/>
  <rect x="340" y="60" width="24" height="30" rx="6" fill="#3B82F6"/>
  <rect x="340" y="170" width="24" height="40" rx="6" fill="#EF4444"/>

  <rect x="390" y="50" width="24" height="170" rx="12" fill="#E4E4E7"/>
  <rect x="390" y="90" width="24" height="80" rx="6" fill="#EF4444"/>

  <rect x="440" y="50" width="24" height="150" rx="12" fill="#E4E4E7"/>
