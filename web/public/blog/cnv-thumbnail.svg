  <rect x="140" y="50" width="24" height="260" rx="12" fill="#E4E4E7"/>
  <rect x="140" y="60" width="24" height="40" rx="6" fill="#EF4444"/>
  <rect x="140" y="180" width="24" height="90" rx="6" fill="#3B82F6"/>

  <rect x="190" y="50" width="24" height="240" rx="12" fill="#E4E4E7"/>
